
name: Headless Signup
on: workflow_dispatch
jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
          
      - name: Run headless signup
        run: |
          python3 << 'SCRIPT'
import asyncio
from playwright.async_api import async_playwright

async def main():
    async with async_playwright() as p:
        browser = await p.chromium.launch(headless=True)
        context = await browser.new_context(
            user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
        )
        page = await context.new_page()
        
        # Navigate to signup
        print("=== Navigating to signup ===")
        await page.goto('https://github.com/signup', wait_until='networkidle', timeout=30000)
        print(f"Title: {await page.title()}")
        print(f"URL: {page.url}")
        
        # Step 1: Enter email
        email_input = page.locator('input[name="user[email]"]')
        if await email_input.count() > 0:
            import hashlib, time as t
            uid = hashlib.md5(str(t.time()).encode()).hexdigest()[:8]
            email = f"bspl{uid}@uberip.com"
            print(f"Email: {email}")
            await email_input.fill(email)
            await page.wait_for_timeout(1000)
            
            # Look for continue button
            continue_btn = page.locator('button:has-text("Continue")')
            if await continue_btn.count() > 0:
                await continue_btn.click()
                await page.wait_for_timeout(2000)
                print("Clicked Continue after email")
        
        # Step 2: Enter password
        pwd_input = page.locator('input[name="user[password]"]')
        if await pwd_input.count() > 0:
            await pwd_input.fill('V3ry$tr0ng#2026!')
            await page.wait_for_timeout(1000)
            continue_btn = page.locator('button:has-text("Continue")')
            if await continue_btn.count() > 0:
                await continue_btn.click()
                await page.wait_for_timeout(2000)
                print("Clicked Continue after password")
        
        # Step 3: Enter username
        user_input = page.locator('input[name="user[login]"]')
        if await user_input.count() > 0:
            await user_input.fill(f"bspl{uid}")
            await page.wait_for_timeout(1000)
            continue_btn = page.locator('button:has-text("Continue")')
            if await continue_btn.count() > 0:
                await continue_btn.click()
                await page.wait_for_timeout(2000)
                print("Clicked Continue after username")
        
        # Step 4: Wait for captcha
        print("Waiting for captcha step...")
        await page.wait_for_timeout(5000)
        
        # Check current state
        print(f"Current URL: {page.url}")
        print(f"Current title: {await page.title()}")
        
        # Check for captcha iframe
        frames = page.frames
        print(f"Frames: {len(frames)}")
        for frame in frames:
            print(f"  Frame: {frame.url}")
        
        # Check for octocaptcha
        octo_frame = page.locator('iframe[src*="octocaptcha"]')
        print(f"Octocaptcha iframes: {await octo_frame.count()}")
        
        # Check for submit button
        submit_btn = page.locator('button[type="submit"]:visible, .js-octocaptcha-form-submit:visible')
        print(f"Submit buttons visible: {await submit_btn.count()}")
        
        # Wait more for captcha to auto-complete
        await page.wait_for_timeout(35000)  # Wait 35 seconds for timeout handler
        
        print(f"After 35s wait:")
        print(f"  URL: {page.url}")
        print(f"  Title: {await page.title()}")
        
        # Check for error_loading_captcha
        elc = page.locator('#error_loading_captcha')
        print(f"  error_loading_captcha element: {await elc.count()}")
        
        # Check if submit button is enabled
        submit_btn = page.locator('.js-octocaptcha-form-submit')
        if await submit_btn.count() > 0:
            is_disabled = await submit_btn.get_attribute('disabled')
            is_hidden = await submit_btn.get_attribute('hidden')
            print(f"  Submit: disabled={is_disabled}, hidden={is_hidden}")
            
            # Click it if enabled
            if not is_disabled:
                print("  Clicking submit!")
                await submit_btn.click()
                await page.wait_for_timeout(5000)
                print(f"  After submit - URL: {page.url}")
                print(f"  After submit - Title: {await page.title()}")
        
        # Take a final state dump
        content = await page.content()
        print(f"  Page size: {len(content)}")
        
        # Check for verification page
        if 'account_verifications' in page.url or 'verif' in page.url.lower():
            print("  >>> REACHED VERIFICATION PAGE <<<")
        
        await browser.close()

asyncio.run(main())
SCRIPT
